<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Copas</title>
    <style>
        body {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            overflow: hidden;
        }
        .copa {
            width: 50px;
            height: 50px;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Wine_Glass_%28yellow%29.svg/1200px-Wine_Glass_%28yellow%29.svg.png');
            background-size: cover;
            margin: 5px;
        }
    </style>
</head>
<body>
    <script>
        document.body.addEventListener("click", function() {
            let copas = document.querySelectorAll('.copa').length;
            for (let i = 0; i < copas; i++) {
                let nuevaCopa = document.createElement("div");
                nuevaCopa.classList.add("copa");
                document.body.appendChild(nuevaCopa);
            }
        });

        // Agregar la primera copa al inicio
        window.onload = function() {
            let primeraCopa = document.createElement("div");
            primeraCopa.classList.add("copa");
            document.body.appendChild(primeraCopa);
        }
    </script>
</body>
</html>
